name: Core R checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libcurl4-openssl-dev pkg-config
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: core-r-4.6.0-${{ runner.os }}-${{ hashFiles('scripts/install_core.R') }}
      - run: Rscript scripts/install_core.R
      - run: Rscript scripts/start_core.R --prepare-only
      - run: Rscript scripts/check_core.R
      - run: Rscript scripts/check_core_results.R
  windows-launch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
      - run: Rscript scripts/install_core.R
      - name: Prepare Windows launcher
        shell: cmd
        run: call Start-Windows.cmd --prepare-only
