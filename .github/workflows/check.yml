name: Core and extension loading checks
on:
  push:
    branches: [development/v2.0]
    paths: ['**/*.R', '.github/workflows/check.yml', 'scripts/*.cjs', 'www/**']
  pull_request:
    paths: ['**/*.R', '.github/workflows/check.yml', 'scripts/*.cjs', 'www/**']
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      CORE_NUMERIC_OUTPUT: validation/v2_core_check_results.json
      CORE_DISPLAY_OUTPUT: validation/v2_core_display_results.json
      EXTENSION_CHECK_OUTPUT: validation/v2_sas_extension_load_results.json
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libcurl4-openssl-dev pkg-config
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: core-extension-r-4.6.0-${{ runner.os }}-${{ hashFiles('scripts/install_core.R', 'scripts/install.R') }}
      - run: Rscript scripts/install_core.R --with-sas
      - run: Rscript scripts/start_core.R --prepare-only
      - name: Install full-entry document dependency
        run: Rscript -e 'if (!requireNamespace("markdown", quietly = TRUE)) install.packages("markdown")'
      - name: Parse and construct both application entries
        run: Rscript scripts/check_extensions.R
      - run: Rscript scripts/check_core.R
      - run: Rscript scripts/check_core_results.R
      - name: Verify synthetic SAS input equivalence
        run: Rscript scripts/check_sas_inputs.R
  windows-launch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
      - run: Rscript scripts/install_core.R
      - name: Prepare Windows launcher
        shell: cmd
        run: call Start-Windows.cmd --prepare-only
